<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sala de Espera — EPI Games</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#0d1b2e;--gold:#f5a623;--green:#1a9e5c;--bg:#0a1628}
body{background:var(--bg);color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--navy);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}
.header-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.header-sala{font-size:11px;color:#6b7a99}
.screen{display:none;flex:1;flex-direction:column;padding:20px;max-width:480px;margin:0 auto;width:100%}
.screen.active{display:flex}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.big-icon{font-size:60px}
.title{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--gold);letter-spacing:2px}
.sub{font-size:13px;color:#6b7a99;line-height:1.6;max-width:280px}
.inp{width:100%;padding:14px 16px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:16px;outline:none;font-family:'Inter',sans-serif}
.inp:focus{border-color:var(--gold)}
.btn{width:100%;padding:16px;background:var(--gold);border:none;border-radius:12px;color:#000;font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:dotB 1.2s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dotB{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.conn{font-size:11px;color:#6b7a99;margin-top:8px}
.conn.ok{color:var(--green)}
.game-alert{background:rgba(245,166,35,.1);border:2px solid var(--gold);border-radius:14px;padding:16px;margin-top:8px;animation:pulseIn .5s cubic-bezier(.17,.89,.32,1.28)}
@keyframes pulseIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.game-name{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--gold);letter-spacing:1px}
.game-load{font-size:12px;color:#6b7a99;margin-top:4px}
.player-badge{background:rgba(255,255,255,.06);border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600;color:var(--gold)}
</style>
</head>
<body>
<div class="header">
  <div class="header-title">🧤 EPI GAMES</div>
  <div class="header-sala">Sala: <strong id="sala-lbl">—</strong></div>
</div>

<!-- S1: ENTRAR -->
<div class="screen active" id="s-entrar">
  <div class="center">
    <div class="big-icon">🧤</div>
    <div class="title">EPI GAMES</div>
    <div class="sub">Digite seu nome para entrar na sala. O apresentador vai escolher o jogo!</div>
    <input class="inp" id="inp-name" placeholder="Seu nome" maxlength="20" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')entrar()"/>
    <button class="btn" onclick="entrar()">▶ ENTRAR NA SALA</button>
    <div class="conn" id="conn-lbl">Conectando...</div>
  </div>
</div>

<!-- S2: AGUARDANDO -->
<div class="screen" id="s-aguardando">
  <div class="center">
    <div class="big-icon">⏳</div>
    <div class="title" id="ola-name">Olá!</div>
    <div class="player-badge" id="player-badge">Você está na sala</div>
    <div class="sub">Aguardando o apresentador escolher o jogo...</div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="conn ok" id="conn-lbl2">● Conectado</div>
  </div>
</div>

<!-- S3: REDIRECIONANDO -->
<div class="screen" id="s-indo">
  <div class="center">
    <div class="big-icon" id="go-icon">🎮</div>
    <div class="title">PREPARE-SE!</div>
    <div class="game-alert">
      <div class="game-name" id="go-name">Carregando...</div>
      <div class="game-load">Abrindo o jogo...</div>
    </div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyCizjgUCO2SXI6ozqjYmuj2LhJm1i0Rx28",
  authDomain:"sipatmin-uniluvas-c0c3d.firebaseapp.com",
  databaseURL:"https://sipatmin-uniluvas-c0c3d-default-rtdb.firebaseio.com",
  projectId:"sipatmin-uniluvas-c0c3d",
  storageBucket:"sipatmin-uniluvas-c0c3d.firebasestorage.app",
  messagingSenderId:"764249882558",
  appId:"1:764249882558:web:c10e3c0eb72f0b484183ef"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Catálogo de jogos disponíveis
const JOGOS = {
  quiz:    { nome:'QUIZ EPI',    icon:'❓', url:'banca.html' },
  memoria: { nome:'MEMÓRIA EPI', icon:'🃏', url:'memoria.html' },
  corrida: { nome:'CORRIDA EPI', icon:'⚡', url:'corrida.html' },
  erros:   { nome:'ACHE O ERRO', icon:'🔍', url:'erros.html' }
};

let ROOM_CODE = 'SIPAT-PA';
let playerName = '';
let uid = localStorage.getItem('epi_uid') || ('u_' + Math.random().toString(36).slice(2,10));
localStorage.setItem('epi_uid', uid);
let redirecting = false;

// Ler ?sala= da URL
(function(){
  const p = new URLSearchParams(window.location.search);
  const s = p.get('sala');
  if(s && s.trim()) ROOM_CODE = s.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
  document.getElementById('sala-lbl').textContent = ROOM_CODE;
})();

// Status de conexão
db.ref('.info/connected').on('value', snap=>{
  const c = snap.val();
  ['conn-lbl','conn-lbl2'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.textContent = c ? '● Conectado' : 'Conectando...';
    el.className = 'conn' + (c ? ' ok' : '');
  });
});

function show(id){
  ['s-entrar','s-aguardando','s-indo'].forEach(s=>{
    const el = document.getElementById(s);
    if(el) el.classList.remove('active');
  });
  const t = document.getElementById(id);
  if(t) t.classList.add('active');
}

// Se já tem nome salvo, entra direto
const savedName = localStorage.getItem('epi_name_' + ROOM_CODE);
if(savedName){
  document.getElementById('inp-name').value = savedName;
}

function entrar(){
  const n = document.getElementById('inp-name').value.trim();
  if(!n){ alert('Digite seu nome!'); return; }
  playerName = n;
  localStorage.setItem('epi_name_' + ROOM_CODE, n);

  // Registrar na sala
  db.ref('sipatmin/'+ROOM_CODE+'/players/'+uid).update({
    name: playerName,
    joined: Date.now(),
    online: true
  });

  document.getElementById('ola-name').textContent = 'Olá, ' + playerName + '!';
  document.getElementById('player-badge').textContent = '🧤 ' + playerName;
  show('s-aguardando');

  // ESCUTAR qual jogo o admin escolheu
  db.ref('sipatmin/'+ROOM_CODE+'/activeGame').on('value', snap=>{
    const game = snap.val();
    if(!game || redirecting) return;
    if(!JOGOS[game]) return;
    irParaJogo(game);
  });
}

function irParaJogo(gameKey){
  redirecting = true;
  const jogo = JOGOS[gameKey];
  document.getElementById('go-icon').textContent = jogo.icon;
  document.getElementById('go-name').textContent = jogo.nome;
  show('s-indo');
  // Aguarda 1.2s para o jogador ver a mensagem, depois redireciona
  setTimeout(()=>{
    window.location.href = jogo.url + '?sala=' + encodeURIComponent(ROOM_CODE) + '&nome=' + encodeURIComponent(playerName);
  }, 1200);
}
</script>
</body>
</html>
