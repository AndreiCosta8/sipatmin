<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Memoria EPI — Uniluvas</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#0d1b2e;--gold:#f5a623;--green:#1a9e5c;--red:#e8483a;--bg:#0a1628}
body{background:var(--bg);color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--navy);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.06)}
.header-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;color:var(--gold)}
.score-badge{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--gold);background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:20px;padding:3px 12px}
.status-bar{background:rgba(255,255,255,.03);padding:7px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
.status-txt{font-size:11px;color:#6b7a99;letter-spacing:1px;text-transform:uppercase}
.timer{font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;letter-spacing:1px}
.timer.urgent{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.5}}
.screen{display:none;flex:1;flex-direction:column;padding:14px;max-width:600px;margin:0 auto;width:100%}
.screen.active{display:flex}
.lobby-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
.lobby-icon{font-size:52px}
.lobby-title{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--gold);letter-spacing:2px}
.lobby-sub{font-size:13px;color:#6b7a99;line-height:1.6;max-width:270px}
.inp{width:100%;padding:13px 15px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:16px;font-family:'Inter',sans-serif;outline:none}
.inp:focus{border-color:var(--gold)}
.btn-main{width:100%;padding:15px;background:var(--gold);border:none;border-radius:12px;color:#000;font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:transform .1s}
.btn-main:active{transform:scale(.97)}
.wait-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.wait-title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--gold)}
.dots{display:flex;gap:8px;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:dotB 1.2s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes dotB{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start;padding-bottom:12px;max-width:480px;margin:0 auto;width:100%}
.mem-card{aspect-ratio:1;perspective:600px;cursor:pointer}
.mem-card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.mem-card.flipped .mem-card-inner,.mem-card.matched .mem-card-inner{transform:rotateY(180deg)}
.mem-card.matched .card-front{border-color:var(--green);box-shadow:0 0 10px rgba(26,158,92,.5)}
.card-back,.card-front{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden}
.card-back{background:linear-gradient(135deg,#1a2a4a,#0d1b2e);border:2px solid rgba(245,166,35,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.card-back-icon{font-size:24px}
.card-back-lbl{font-family:'Oswald',sans-serif;font-size:8px;color:rgba(245,166,35,.5);letter-spacing:1px;text-transform:uppercase}
.card-front{transform:rotateY(180deg);border:2px solid #ddd;background:#fff;position:relative}
.card-front img{width:100%;height:100%;object-fit:cover;display:block}
.card-front.produto img{object-fit:contain;padding:4px}
.card-front.produto{background:#fff}
.card-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:12px 4px 3px;text-align:center}
.card-label span{font-family:'Oswald',sans-serif;font-size:7px;font-weight:700;color:#fff;letter-spacing:.5px;text-transform:uppercase;line-height:1.2}
.mem-card.wrong .mem-card-inner{animation:shake .4s ease}
@keyframes shake{0%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}100%{transform:rotateY(180deg) translateX(0)}}
.result-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.result-trophy{font-size:64px;animation:tPop .6s cubic-bezier(.17,.89,.32,1.28)}
@keyframes tPop{from{transform:scale(0)}to{transform:scale(1)}}
.result-title{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:var(--gold)}
.result-stats{display:flex;gap:12px}
.stat-box{background:rgba(255,255,255,.05);border-radius:12px;padding:11px 18px;text-align:center}
.stat-num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--gold)}
.stat-lbl{font-size:10px;color:#6b7a99;text-transform:uppercase;letter-spacing:1px}
.btn-rank{padding:13px 28px;background:var(--gold);border:none;border-radius:12px;color:#000;font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;cursor:pointer}
.rank-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center}
.rank-box{background:var(--navy);border-radius:16px;padding:18px;width:90%;max-width:340px;max-height:80vh;overflow-y:auto}
.rank-title{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:10px}
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.rank-row.me{background:rgba(245,166,35,.08);border-radius:8px;padding:9px 8px}
.rank-pos{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--gold);width:26px;text-align:center}
.rank-name{flex:1;font-size:13px;font-weight:600}
.rank-time{font-family:'Oswald',sans-serif;font-size:13px;color:#6b7a99}
.btn-close{width:100%;margin-top:10px;padding:11px;background:rgba(255,255,255,.06);border:none;border-radius:10px;color:#fff;font-size:13px;cursor:pointer}
.conf-wrap{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;display:none}
.conf-p{position:absolute;top:-20px;animation:cFall linear infinite}
@keyframes cFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:0}}

/* DESKTOP: cartas menores e centralizadas */
@media(min-width:700px){
  .grid{max-width:520px;gap:10px}
  .card-label span{font-size:9px}
  .card-back-icon{font-size:32px}
}
/* CELULAR PEQUENO: labels menores */
@media(max-width:380px){
  .grid{gap:5px;max-width:100%}
  .card-label span{font-size:6px}
  .card-back-icon{font-size:20px}
}
</style>
</head>
<body>
<div class="header">
  <div class="header-title">&#127183; MEMORIA EPI</div>
  <div class="score-badge" id="score-disp">0 pts</div>
</div>
<div class="status-bar">
  <span class="status-txt" id="status-txt">Conectando...</span>
  <span class="timer" id="timer-disp">00:00</span>
</div>
<div class="conf-wrap" id="conf-wrap"></div>
<div class="rank-overlay" id="rank-overlay">
  <div class="rank-box">
    <div class="rank-title">&#127942; Ranking Final</div>
    <div id="rank-list-overlay"></div>
    <button class="btn-close" onclick="document.getElementById('rank-overlay').style.display='none'">Fechar</button>
  </div>
</div>
<div class="screen active" id="s-lobby">
  <div class="lobby-center">
    <div class="lobby-icon">🃏</div>
    <div class="lobby-title">MEMORIA EPI</div>
    <div class="lobby-sub">Combine a luva com a situacao de campo. Mais rapido e sem erros = mais pontos!</div>
    <input class="inp" id="inp-name" placeholder="Seu nome" maxlength="20" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')enterGame()"/>
    <button class="btn-main" onclick="enterGame()">&#9654; ENTRAR NA SALA</button>
    <div style="font-size:11px;color:#6b7a99;margin-top:4px" id="conn-lbl">Conectando ao Firebase...</div>
  </div>
</div>
<div class="screen" id="s-wait">
  <div class="wait-center">
    <div style="font-size:52px">🧤</div>
    <div class="wait-title" id="wait-name">Ola!</div>
    <div style="font-size:13px;color:#6b7a99">Aguardando o apresentador iniciar...</div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div style="font-size:11px;color:#6b7a99;margin-top:6px">Sala: <strong id="sala-disp">MEMORIA</strong></div>
  </div>
</div>
<div class="screen" id="s-game">
  <div class="grid" id="card-grid"></div>
</div>
<div class="screen" id="s-result">
  <div class="result-center">
    <div class="result-trophy" id="res-trophy">🏆</div>
    <div class="result-title" id="res-title">Parabens!</div>
    <div class="result-stats">
      <div class="stat-box"><div class="stat-num" id="res-time">--</div><div class="stat-lbl">Tempo</div></div>
      <div class="stat-box"><div class="stat-num" id="res-erros">--</div><div class="stat-lbl">Erros</div></div>
      <div class="stat-box"><div class="stat-num" id="res-pts">--</div><div class="stat-lbl">Pontos</div></div>
    </div>
    <button class="btn-rank" onclick="showRanking()">&#127941; Ver Ranking</button>
    <button class="btn-rank" style="background:rgba(255,255,255,.1);color:#fff;margin-top:8px" onclick="voltarLobby()">&#8617; Voltar ao lobby</button>
  </div>
</div>

  // Reusar uid da central para manter o mesmo jogador
  const savedUid=localStorage.getItem("epi_uid");
  if(savedUid) uid=savedUid;
  // Nome vindo da central via URL (?nome=Joao)
  const nomeUrl=p.get("nome");
  if(nomeUrl&&nomeUrl.trim()){
    document.getElementById("inp-name").value=nomeUrl.trim();
    setTimeout(()=>enterGame(),300);
    return;
  }
  // Ou nome salvo no localStorage
  const nomeSalvo=localStorage.getItem("epi_name_"+ROOM_CODE)||localStorage.getItem("epi_nome");
  if(nomeSalvo){
    document.getElementById("inp-name").value=nomeSalvo;
    setTimeout(()=>enterGame(),300);
  }
})();
function show(id){
  ["s-lobby","s-wait","s-game","s-result"].forEach(s=>{
    const el=document.getElementById(s);if(el)el.classList.remove("active");
  });
  const t=document.getElementById(id);if(t)t.classList.add("active");
}
function enterGame(){
  const n=document.getElementById("inp-name").value.trim();
  if(!n){alert("Digite seu nome!");return;}
  playerName=n;
  db.ref("sipatmin/"+ROOM_CODE+"/players/"+uid).set({name:playerName,score:0,time:0,erros:0,joined:Date.now()});
  document.getElementById("wait-name").textContent="Ola, "+playerName+"! 🧤";
  show("s-wait");
  db.ref("sipatmin/"+ROOM_CODE+"/session").on("value",snap=>{
    const s=snap.val();
    if(s&&s.active&&!gameStarted){gameStarted=true;startGame();}
    if(s&&s.reset){window.location.href="aguarde.html?sala="+encodeURIComponent(ROOM_CODE);}
  });
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildGrid(){
  let all=[];
  PAIRS.forEach(p=>{
    all.push({...p.a,pairId:p.id});
    all.push({...p.b,pairId:p.id});
  });
  all=shuffle(all);
  const grid=document.getElementById("card-grid");
  grid.innerHTML="";
  all.forEach(card=>{
    const div=document.createElement("div");
    div.className="mem-card";
    div.dataset.pairId=card.pairId;
    const frontClass=card.tipo==="PRODUTO"?"card-front produto":"card-front";
    div.innerHTML="<div class='mem-card-inner'>"
      +"<div class='card-back'><div class='card-back-icon'>🧤</div><div class='card-back-lbl'>EPI</div></div>"
      +"<div class='"+frontClass+"'><img src='"+card.img+"' alt='"+card.lbl+"'><div class='card-label'><span>"+card.lbl+"</span></div></div>"
      +"</div>";
    div.addEventListener("click",()=>flipCard(div));
    grid.appendChild(div);
  });
}
function flipCard(el){
  if(locked||el.classList.contains("flipped")||el.classList.contains("matched"))return;
  el.classList.add("flipped");flipped.push(el);
  if(flipped.length===2){
    locked=true;
    const[a,b]=flipped;
    if(a.dataset.pairId===b.dataset.pairId){
      setTimeout(()=>{
        a.classList.add("matched");b.classList.add("matched");
        matched.push(a.dataset.pairId);
        score+=Math.max(50,200-erros*15);
        updateScore();sndMatch();
        flipped=[];locked=false;
        if(matched.length===PAIRS.length)finishGame();
      },350);
    }else{
      erros++;
      sndWrong();
      setTimeout(()=>{
        a.classList.add("wrong");b.classList.add("wrong");
        setTimeout(()=>{a.classList.remove("flipped","wrong");b.classList.remove("flipped","wrong");flipped=[];locked=false;},500);
      },600);
    }
  }
}
function startGame(){
  erros=0;score=0;flipped=[];matched=[];locked=false;
  updateScore();buildGrid();show("s-game");
  startTime=Date.now();
  timerInterval=setInterval(()=>{
    elapsedSecs=Math.floor((Date.now()-startTime)/1000);
    const m=String(Math.floor(elapsedSecs/60)).padStart(2,"0"),s=String(elapsedSecs%60).padStart(2,"0");
    const td=document.getElementById("timer-disp");
    if(td){td.textContent=m+":"+s;td.className="timer"+(elapsedSecs>90?" urgent":"");}
  },500);
}
function updateScore(){const el=document.getElementById("score-disp");if(el)el.textContent=score+" pts";}
function finishGame(){
  clearInterval(timerInterval);
  const fp=Math.max(0,score-elapsedSecs*2);score=fp;updateScore();
  db.ref("sipatmin/"+ROOM_CODE+"/players/"+uid).update({score:fp,time:elapsedSecs,erros:erros,finished:true});
  setTimeout(()=>{
    show("s-result");
    document.getElementById("res-trophy").textContent=erros===0?"🏆":matched.length>=6?"🥈":"🎖";
    document.getElementById("res-title").textContent=erros===0?"Perfeito! Zero erros!":"Muito bem, "+playerName+"!";
    const m=Math.floor(elapsedSecs/60),s=String(elapsedSecs%60).padStart(2,"0");
    document.getElementById("res-time").textContent=m+"m"+s+"s";
    document.getElementById("res-erros").textContent=erros;
    document.getElementById("res-pts").textContent=fp;
    if(fp>400)launchConfetti();sndWin();
  },600);
}
function showRanking(){
  db.ref("sipatmin/"+ROOM_CODE+"/players").once("value",snap=>{
    const pl=snap.val()||{};
    const list=Object.values(pl).filter(p=>p.finished).sort((a,b)=>b.score-a.score);
    const medals=["🏆","🥈","🥉"];
    document.getElementById("rank-list-overlay").innerHTML=list.length
      ?list.map((p,i)=>"<div class='rank-row "+(p.name===playerName?"me":"")+"'><div class='rank-pos'>"+(medals[i]||(i+1)+"o")+"</div><div class='rank-name'>"+p.name+"</div><div class='rank-time'>"+p.score+"pts</div></div>").join("")
      :"<div style='text-align:center;color:#6b7a99;padding:16px'>Nenhum resultado ainda</div>";
    document.getElementById("rank-overlay").style.display="flex";
  });
}
function voltarLobby(){
  window.location.href="aguarde.html?sala="+encodeURIComponent(ROOM_CODE);
}

function launchConfetti(){

  setTimeout(()=>{wrap.style.display="none";},4000);
}
